name: Validate AstroSpace foundation

on:
  push:
    branches: [main, "foundation/**", "visual/**", "forge/**", "game/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check assets/planet-forge.js
          node --check assets/pbr-surfaces.js
          node --check assets/planetary-detail.js
          node --check play/play.js
          node --check play/social-ui.js
          node --check play/auth.js
      - name: Validate HTML and CSS entry points
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text()
          assert 'id="space-canvas"' in html
          assert '/assets/planet-explorer.css' in html
          assert '/assets/planet-forge.js' in html
          assert 'href="/play/"' in html
          play_html = Path("play/index.html").read_text()
          for token in ('id="game-canvas"', 'id="character-overlay"', 'id="account-overlay"',
                        'id="settings-overlay"', 'id="adaptive-quality"', '/play/play.js'):
              assert token in play_html, token
          play_css = Path("play/play.css").read_text()
          assert ".game-topbar{position:absolute" in play_css
          assert ".film-grain{" in play_css
          assert play_css.count("{") == play_css.count("}")
          assert play_css.count("(") == play_css.count(")")
          print("Website + playable prologue + player controls contract: PASS")
          PY
      - name: Run browser gameplay contracts
        run: |
          node tests/test_campaign.mjs
          node tests/test_interplanetary_travel.mjs
          node tests/test_pbr_surface.mjs
          node tests/test_webgl_boot.mjs
          node tests/test_player_systems.mjs
          node tests/test_planetary_detail.mjs
          node tests/test_planetary_detail_palette.mjs
      - name: Set up CMake
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Validate JSON data
        run: |
          python3 -m json.tool data/sector_01.json >/dev/null
          python3 -m json.tool data/cosmic_events.json >/dev/null
          python3 -m json.tool data/planet_visuals.json >/dev/null
