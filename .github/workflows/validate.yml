name: Validate AstroSpace foundation

on:
  push:
    branches: [main, "foundation/**", "visual/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check assets/planet-explorer.js
      - name: Validate HTML entry points
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text()
          assert 'id="space-canvas"' in html
          assert '/assets/planet-explorer.css' in html
          assert '/assets/planet-explorer.js' in html
          js = Path("assets/planet-explorer.js").read_text()
          for token in ("Kharon's Rest", "Vespera", "Cinderwake", "Nox Aeterna", "Aureon", "Glaciera"):
              assert token in js, token
          assert "ridgesMix" not in js
          print("HTML/asset contract: PASS")
          PY
      - name: Set up CMake
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Validate JSON data
        run: |
          python3 -m json.tool data/sector_01.json >/dev/null
          python3 -m json.tool data/cosmic_events.json >/dev/null
