name: Validate AstroSpace foundation

on:
  push:
    branches: [main, "foundation/**", "visual/**", "forge/**", "game/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check assets/planet-forge.js
          node --check play/play.js
      - name: Validate HTML entry points
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text()
          assert 'id="space-canvas"' in html
          assert '/assets/planet-explorer.css' in html
          assert '/assets/planet-forge.js' in html
          assert 'href="/play/"' in html
          play_html = Path("play/index.html").read_text()
          assert 'id="game-canvas"' in play_html
          assert '/play/play.css' in play_html
          assert '/play/play.js' in play_html
          play_css = Path("play/play.css").read_text()
          assert ".game-topbar{position:absolute" in play_css
          assert "xmlns=" not in play_css
          assert ".film-grain{" in play_css
          assert ".bottom-hud{left:var(--hud-edge)" in play_css
          assert ".right-hud{right:var(--hud-edge)" in play_css
          assert play_css.count("{") == play_css.count("}")
          assert play_css.count("(") == play_css.count(")")
          js = Path("assets/planet-forge.js").read_text()
          for token in ("Elyndra", "Nerith", "Kaldrax", "Vanthris", "Orovane", "Iskara"):
              assert token in js, token
          assert "const planetVertex" in js and "const planetFragment" in js
          play_js = Path("play/play.js").read_text()
          for token in ("THE FIRST", "flightUnlocked", "AETHER", "STAR ATLAS", "ELYNDRA"):
              assert token in play_js, token
          assert "treeCount=68" in play_js
          assert "craft.position.set(27,terrainHeight(27,20,next),20)" in play_js
          assert "cameraDistance=12.2" in play_js
          print("Website + playable prologue + HUD composition contract: PASS")
          PY
      - name: Set up CMake
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Validate JSON data
        run: |
          python3 -m json.tool data/sector_01.json >/dev/null
          python3 -m json.tool data/cosmic_events.json >/dev/null
          python3 -m json.tool data/planet_visuals.json >/dev/null
